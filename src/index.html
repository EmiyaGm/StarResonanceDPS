<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星痕共鸣 DPS 统计工具</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="output.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<body>
    <div class="app">
        <!-- 顶部导航栏 -->
        <div id="topNavBar">
            <div class="flex items-center justify-between navbar-content">
                <button id="clearStatsBtn" class="btn btn-warning !p-0 !min-h-0 !h-auto !ml-2">
                    <span class="btn-icon">🗑️</span>
                </button>
                <div class="navbar-brand !ml-4">
                    <label class="swap">
                        <input type="checkbox" id="typeCheckBox" />
                        <div class="swap-off">总体：伤害</div>
                        <div class="swap-on">总体：治疗</div>
                    </label>
                </div>

                <div class="navbar-center">
                    <div class="status-card flex items-center justify-center" id="statusCard">
                        <div class="status-indicator" id="statusIndicator">
                            <div class="status-dot"></div>
                            <span class="status-text">待连接</span>
                        </div>
                        <div class="status-info">
                            <div class="status-detail">
                                <span class="label">设备</span>
                                <span class="value" id="currentDevice">未选择</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="window-controls">
                    <button class="window-control-btn show-btn" id="showDeviceBtn" title="显示设备选择"
                        style="display: none;">
                        <span>👀</span>
                    </button>
                    <button class="window-control-btn minimize-btn" id="minimizeBtn" title="最小化">
                        <span>–</span>
                    </button>
                    <button class="window-control-btn maximize-btn" id="maximizeBtn" title="最大化">
                        <span>□</span>
                    </button>
                    <button class="window-control-btn close-btn" id="closeBtn" title="关闭">
                        <span>✕</span>
                    </button>
                </div>
            </div>
            <!-- 控制面板 -->
            <div class="control-section" id="controlArea">
                <div class="control-card">
                    <div class="card-content !p-0">
                        <div class="control-row">
                            <div class="control-group">
                                <select id="deviceSelect" class="device-select" disabled>
                                    <option value="">正在加载设备...</option>
                                </select>
                            </div>
                            <div class="flex items-center justify-center gap-2">
                                <button id="hideDeviceBtn" class="btn btn-outline btn-sm !p-0 !min-h-0 !h-auto"
                                    title="隐藏设备选择" disabled>
                                    <span class="btn-icon">😌</span>
                                </button>
                                <button id="refreshDeviceBtn" class="btn btn-outline btn-sm !p-0 !min-h-0 !h-auto"
                                    title="刷新设备列表">
                                    <span class="btn-icon">🔄</span>
                                </button>
                                <button id="startCaptureBtn" class="btn btn-success !p-0 !min-h-0 !h-auto" disabled>
                                    <span class="btn-icon">▶️</span>
                                </button>
                                <button id="stopCaptureBtn" class="btn btn-danger !p-0 !min-h-0 !h-auto" disabled>
                                    <span class="btn-icon">⏹️</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <main class="main-container">
